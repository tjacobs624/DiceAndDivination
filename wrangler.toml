name = "dnd-discord-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The MCP endpoint must sit behind Cloudflare Access, and Access can only
# protect a hostname inside a Cloudflare zone in THIS account. A *.workers.dev
# URL cannot be protected by Access, so we disable it and serve from a custom
# domain instead.
workers_dev = false

# Served on a subdomain of charmandcrit.com (a zone in this Cloudflare account).
# The zone must be active in Cloudflare DNS. Not secret; safe to commit.
[[routes]]
pattern = "dnd-mcp.charmandcrit.com"
custom_domain = true

[observability]
enabled = true

# NOTE: There are intentionally no [vars] here. Nothing is hardcoded or committed.
# All runtime config is injected as Cloudflare secrets (or .dev.vars locally):
#   wrangler secret put DISCORD_BOT_TOKEN
#   wrangler secret put DISCORD_GUILD_ID
#   wrangler secret put ACCESS_TEAM_DOMAIN
#   wrangler secret put ACCESS_AUD
